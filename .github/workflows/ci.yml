name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # The PostgreSQL actor store's tests run against it (DASERVER_TEST_POSTGRES); the e2e starts its own through Aspire.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daserver_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: DaServer

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: DaServer/global.json

      - name: Build
        working-directory: DaServer
        run: dotnet build DaServer.slnx -c Release

      - name: Test
        working-directory: DaServer
        env:
          DASERVER_TEST_POSTGRES: Host=localhost;Username=postgres;Password=postgres;Database=daserver_test
        run: dotnet test tests/DaServer.Tests -c Release --no-build --blame-hang-timeout 120s

      - name: Sample tests
        working-directory: DaServer
        run: dotnet test samples/mmo/Sample.Tests -c Release --no-build

      # The sample cluster as deployed (login, game, map, 3 client-facing gateway nodes) started by Aspire, with 1000 bots.
      - name: End to end
        working-directory: DaServer
        run: dotnet test tests/DaServer.E2E -c Release --no-build
