name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: DaServer

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: DaServer/global.json

      - name: Build
        working-directory: DaServer
        run: dotnet build DaServer.slnx -c Release

      - name: Test
        working-directory: DaServer
        run: dotnet test tests/DaServer.Tests -c Release --no-build --blame-hang-timeout 120s

      # The sample cluster as deployed (login, game, 3 gateways, balancer) started by Aspire, with 1000 bots.
      - name: End to end
        working-directory: DaServer
        run: dotnet test tests/DaServer.E2E -c Release --no-build
