<title>DaServer Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* A book page per screen: a narrow margin column (folio, what comes next, the latest status) beside one text column.
   Ink on paper, one indigo for whatever is wrong and for the next step. Hairlines only, square everything. */
:root{--paper:#F7F8FA;--ink:#111318;--ink-2:#3B3F4B;--ink-3:#5B6070;--rule:rgba(17,19,24,.14);--rule-2:rgba(17,19,24,.34);--indigo:#22397E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1014;--ink:#ECEEF2;--ink-2:#BDC1CB;--ink-3:#989DA9;--rule:rgba(236,238,242,.16);--rule-2:rgba(236,238,242,.34);--indigo:#9CAEF0;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1014;--ink:#ECEEF2;--ink-2:#BDC1CB;--ink-3:#989DA9;--rule:rgba(236,238,242,.16);--rule-2:rgba(236,238,242,.34);--indigo:#9CAEF0;color-scheme:dark}
:root{
  --display:'Shippori Mincho','Noto Serif JP','Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho','Songti SC',Georgia,serif;
  --text:'Newsreader','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --mc:224px;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--text);-webkit-font-smoothing:antialiased;font-kerning:normal;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit;border-radius:0}
:focus-visible{outline:1px solid var(--indigo);outline-offset:4px}
button:focus:not(:focus-visible){outline:none}
.ind{color:var(--indigo)}
.num{font-variant-numeric:tabular-nums lining-nums}
.sc{font:400 14px/1.4 var(--text);color:var(--ink-3)}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:1200px;margin-inline:auto}

/* the grid: 12 columns of the 1200px measure, 24px gutters. The margin column is columns 1-2, the page columns 3-12;
   every screen places its units on the page's 10 columns, so positions line up from screen to screen.
   Vertical rhythm is an 8px unit: 8 16 24 32 40 48. */
:root{--g:24px;--s1:8px;--s2:16px;--s3:24px;--s4:32px;--s5:40px;--s6:48px;--row:44px;
  --ease:cubic-bezier(.2,.7,.2,1);--dur:420ms}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g)}

/* header: brand over the margin column, sections over the page */
.top{border-bottom:1px solid var(--rule)}
.topin{align-items:baseline;height:68px;padding-top:26px}
.brand{grid-column:1 / 3;display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.brand b{font:500 18px/1 var(--display);letter-spacing:.01em}
.brand span{font-size:14px;color:var(--ink-3)}
.tabs{grid-column:3 / 11;display:flex;gap:30px}
.tabs button{font-size:15px;color:var(--ink-3);padding:2px 0}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-current="page"]{color:var(--ink)}
.ex{font-size:13px;font-style:italic;color:var(--ink-3)}
.top .ex{display:none}
.env{grid-column:11 / -1;justify-self:end;font-size:14px;color:var(--ink-3);white-space:nowrap}

/* stage: a head row (eyebrow, title, folio) and a body row of fixed height, centred between header and footer,
   so the composition sits in the middle of the screen instead of hanging from the top */
.stage{grid-template-rows:auto minmax(0,1fr);align-content:center;position:relative;min-height:0;overflow:hidden;padding-block:var(--s4);touch-action:none}
.margin{grid-column:1 / 3;grid-row:1 / 3;display:grid;grid-template-rows:subgrid;min-width:0}
.folio{grid-row:1;align-self:end;display:flex;align-items:baseline;gap:8px;color:var(--ink-3)}
.folio .fn{font:400 var(--h1)/1.2 var(--display);color:var(--ink-3)}
.folio .fo{font-size:14px}
.nextl{grid-row:2;align-self:start;display:flex;flex-direction:column;gap:4px;padding-top:var(--s5)}
.nx{font-size:15px;color:var(--ink-2);align-self:flex-start}
.nx:hover{color:var(--ink)}
.nx .ar{margin-left:6px;color:var(--ink-3)}
.status{grid-column:1 / 3;grid-row:2;align-self:end;margin:0;padding-right:var(--s2);font-style:italic;font-size:15px;line-height:1.45;color:var(--ink-2);min-height:4.4em;display:flex;align-items:flex-end}
.page{grid-column:3 / -1;grid-row:1 / 3;display:grid;grid-template-columns:subgrid;grid-template-rows:subgrid;min-width:0;min-height:0}
.head{grid-column:1 / -1;grid-row:1;align-self:end;min-width:0}
:root{--h1:clamp(34px,3.3vw,46px)}
.eyebrow{font-style:italic;font-size:16px;margin:0 0 var(--s1);height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font:500 var(--h1)/1.2 var(--display);margin:0;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:1.2em}
.body > *{align-self:start}
.body{grid-column:1 / -1;grid-row:2;position:relative;display:grid;grid-template-columns:subgrid;grid-auto-rows:auto;align-content:start;row-gap:var(--s4);padding-top:var(--s5);min-height:0;overflow:hidden}

/* footer: fixed key hints under the page column */
.foot{border-top:1px solid var(--rule)}
.footin{align-items:center;height:58px;padding-bottom:env(safe-area-inset-bottom,0px)}
.footin > .ex{grid-column:1 / 3}
.keys{grid-column:3 / -1;display:flex;gap:34px;align-items:baseline;white-space:nowrap}
.kh{display:inline-flex;align-items:baseline;gap:8px}
.k{font:600 15px/1 var(--text);color:var(--ink);padding:4px 2px;box-shadow:inset 0 -1px 0 transparent;transition:box-shadow .12s}
.kd{font-size:14px;color:var(--ink-3)}
.kh button:hover + .kd,.kh .k:hover{color:var(--ink)}
.k.pressed{box-shadow:inset 0 -1px 0 var(--ink);transition:none}
.kh.off .k,.kh.off .kd{color:var(--ink-3);opacity:.5;cursor:default}

/* placement on the page's 10 columns */
.full{grid-column:1 / -1}
.main{grid-column:1 / 7}
.aside{grid-column:8 / -1}
.listc{grid-column:1 / 5}
.detc{grid-column:6 / -1}
.col{display:flex;flex-direction:column;gap:var(--s3);min-width:0}

/* components: one vocabulary.
   a unit = a caption, then a figure or a table, then its foot: actions at the start, the history link at the end */
.lead{font-size:clamp(17px,1.4vw,19px);line-height:1.6;color:var(--ink-2);max-width:56ch;margin:0;text-wrap:pretty}
.uf{display:flex;align-items:baseline;gap:var(--s4);min-height:32px}
.uf .lnk{margin-left:auto}
.acts{display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap}
.act{font:500 clamp(19px,1.5vw,21px)/1.3 var(--display);padding:4px 0 5px;border-bottom:1px solid currentColor}
.act:hover{box-shadow:inset 0 -1px 0 currentColor}
.act:active{transform:translateY(1px)}
.act.pri{color:var(--indigo)}
.act.sec{color:var(--ink-2);border-color:var(--rule-2)}
.act:disabled{color:var(--ink-3);border-color:var(--rule);cursor:default;box-shadow:none;transform:none}
.lnk{font-size:15px;color:var(--ink-2);border-bottom:1px solid var(--rule-2);padding-bottom:1px;white-space:nowrap}
.lnk:hover{color:var(--ink);border-color:var(--ink)}
.code{font:400 13.5px/1.85 var(--mono);color:var(--ink-2);margin:0;white-space:pre-wrap;word-break:break-word}
.code .ind{font-weight:500}
.props{display:grid;grid-template-columns:120px minmax(0,1fr);margin:0;border-top:1px solid var(--rule)}
.props > *{height:var(--row);display:flex;align-items:center;border-bottom:1px solid var(--rule);margin:0;white-space:nowrap;overflow:hidden}
.props dt{color:var(--ink-3);font-size:15px}
.props dd{font-variant-numeric:tabular-nums}
.props.two{grid-template-columns:104px minmax(0,1fr) 104px minmax(0,1fr)}
.cap{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:var(--s1)}

/* figures: a reading, its label above and its normal below, on one hairline */
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:var(--g);border-top:1px solid var(--rule)}
.figs > div{display:flex;flex-direction:column;gap:2px;padding-top:var(--s2)}
.fv{font:400 clamp(30px,2.7vw,38px)/1.15 var(--display);font-variant-numeric:tabular-nums}
.fu{font-size:14.5px;color:var(--ink-3)}

/* incident */
.fig{display:flex;align-items:flex-end;gap:var(--s5)}
.big{font:400 clamp(96px,10vw,140px)/.82 var(--display);color:var(--indigo);font-variant-numeric:tabular-nums}
.bigu{font:400 clamp(26px,2.3vw,32px)/1 var(--display);color:var(--indigo);margin-left:10px}
.ref{display:flex;gap:var(--s4);padding-bottom:4px}
.ref i{font-style:italic}
.ref span{display:flex;flex-direction:column;gap:4px;font:400 26px/1.1 var(--display)}
.chart{position:relative;height:clamp(240px,38vh,340px)}
.chart .uplot{width:100%!important}
.readout{margin:0;font-size:15px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;min-width:0}
.readout b{font-weight:500;color:var(--ink)}
.readout b.ind{color:var(--indigo)}
.readout span+span{margin-left:24px}

/* tables: one row height, hairlines, numbers right-aligned in tabular figures */
.tbl{display:grid;align-content:start}
.tbl > *,.tbl .tr > *{padding-right:var(--s3)}
.tbl .r,.tbl .th.r{padding-right:0;padding-left:var(--s3)}
.tbl > .th{padding:0 0 var(--s1);border-bottom:1px solid var(--rule-2);white-space:nowrap}
.tbl > .td,.tbl .tr > .td{height:var(--row);display:flex;align-items:center;border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.tbl > .td.empty{border-bottom-color:transparent}
.tbl .r{justify-content:flex-end;text-align:right}
.tbl .st{color:var(--ink-2)}
.tbl.dim .td{color:var(--ink-3)}
.tbl.dim .td.hl{color:var(--ink)}
.tbl.dim .td.hl.ind,.tbl .td.ind{color:var(--indigo)}
.tbl.nodes{grid-template-columns:1fr 2.4fr .8fr .9fr .9fr .7fr}
.tbl.ov{grid-template-columns:1.9fr .7fr .9fr .9fr .9fr 1.4fr}
.tbl.ov .tr{display:contents;cursor:pointer}
.tbl.ov .tr:hover .td{color:var(--ink)}
.tbl.ov .tr:focus-visible .td{box-shadow:inset 0 -1px 0 var(--indigo)}
.tbl.ov .bd{padding-left:var(--s4)}
.tbl.gw{grid-template-columns:1fr 2.4fr 1fr 1fr}
.tbl.lg{grid-template-columns:64px minmax(0,1fr) 96px 80px 72px}
.tbl.lg .td{font:400 13.5px/1 var(--mono);color:var(--ink-2)}
.tbl.lg .td.ind{font-weight:500;color:var(--indigo)}

/* list + detail (changes, actors): both start on the same hairline */
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.li{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:var(--s2);align-items:center;height:var(--row);border-bottom:1px solid var(--rule);color:var(--ink-3);font-variant-numeric:tabular-nums}
.li:hover{color:var(--ink-2)}
.li.on{color:var(--ink)}
.li.on .k1{font-weight:600}
.li .ind{color:var(--indigo)}
.li .k3{text-align:right}
.li.two{grid-template-columns:minmax(0,1fr) auto}
.det{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.h2{font:500 clamp(26px,2.3vw,32px)/var(--row) var(--display);height:var(--row);margin:0;border-top:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{margin:0;font-style:italic;color:var(--indigo);min-height:1.55em}
.blk{display:flex;flex-direction:column;gap:6px}

/* audit */
.audit{display:grid;grid-template-columns:92px 140px 210px minmax(0,1fr);border-top:1px solid var(--rule)}
.audit > *{height:var(--row);display:flex;align-items:center;padding-right:20px;border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.audit .w{color:var(--ink-3)}

/* find and confirm */
.qin{width:100%;background:none;border:0;border-bottom:1px solid var(--rule-2);font:400 clamp(24px,2.3vw,32px)/1.3 var(--display);padding:6px 0 10px;outline:none;color:var(--ink)}
.qin::placeholder{color:var(--ink-3)}
.qin:focus{border-bottom-color:var(--ink)}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--g)}
.rg{display:flex;flex-direction:column}
.rg .sc{padding-bottom:8px;border-bottom:1px solid var(--rule)}
.hit{display:flex;justify-content:space-between;align-items:center;gap:12px;height:40px;color:var(--ink-3);border-bottom:1px solid var(--rule)}
.hit .h{font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit:hover{color:var(--ink-2)}
.hit.on{color:var(--ink)}
.hit.on .t{font-weight:600}
.nores{color:var(--ink-3);font-style:italic;margin:0}
.cf label{color:var(--ink-3);font-size:15px}
.cf label b{color:var(--ink);font-weight:600}

/* motion. Text morph (Magic Move by character): kept characters glide from where they were to where they are,
   added ones blur in, removed ones blur out where they stood; the real text stays in place, hidden, so layout
   never moves. A new page glides in from the direction of travel, block by block. */
.mlayer{position:fixed;inset:0;pointer-events:none;z-index:5;contain:strict}
.mc{position:absolute;white-space:pre}
.leave,.probe{position:absolute;inset:var(--s5) 0 auto 0;pointer-events:none;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));column-gap:var(--g);row-gap:var(--s4)}
.leave > *,.probe > *{align-self:start}
.probe{visibility:hidden;top:0;padding-top:var(--s5)}
.tbl.pn{grid-template-columns:1fr auto}

/* distributions: one reading across every node of a type; bars in ink, the accent where something is wrong */
.sm{gap:var(--s1)}
.cap{margin:0}
.dist{position:relative;padding-bottom:22px}
.dist svg{display:block;width:100%;height:56px;overflow:visible;border-bottom:1px solid var(--rule-2)}
.dist rect{fill:var(--ink-3);transform-box:fill-box;transform-origin:50% 100%}
.dist rect.hot{fill:var(--indigo)}
.dist .lim{position:absolute;top:0;height:56px;border-left:1px dashed var(--ink-2)}
.dx{position:absolute;left:0;right:0;bottom:0;height:18px;font-size:13.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dx span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.dx span.start{transform:none}
.dx span.end{transform:translateX(-100%)}
.aside .dist svg,.aside .dist .lim{height:44px}
.mute{color:var(--ink-3)}
.more{margin:0;padding-top:8px;font-size:14px;font-style:italic;color:var(--ink-3)}
.uf .readout{flex:1 1 auto}

/* uPlot (its stylesheet, trimmed to what this page uses) */
.uplot,.uplot *{box-sizing:border-box}
.uplot{width:min-content;font-family:var(--text)}
.u-wrap{position:relative;user-select:none}
.u-over,.u-under{position:absolute}
.u-under{overflow:hidden}
.uplot canvas{display:block;position:relative;width:100%;height:100%}
.u-axis{position:absolute}
.u-cursor-x,.u-cursor-y{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.u-hz .u-cursor-x{height:100%;border-right:1px solid var(--rule-2)}
.u-hz .u-cursor-y{display:none}
.u-cursor-pt{display:none}
.u-axis.u-off,.u-select.u-off,.u-cursor-x.u-off,.u-cursor-y.u-off{display:none}
.u-select{display:none}

/* phone: one column, same order, more screens */
@media (max-width:719px){
  :root{--h1:30px;--row:42px}
  body{font-size:16px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .topin{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;height:auto;padding-top:16px;row-gap:12px}
  .brand{grid-column:1}
  .tabs{grid-column:1 / -1;grid-row:2;gap:0;justify-content:space-between;padding-bottom:12px}
  .tabs button{font-size:14.5px}
  .top .ex{display:block;grid-column:2;grid-row:1}
  .env{display:none}
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);align-content:stretch;padding-block:22px 16px}
  .page{grid-column:1;padding-bottom:84px}
  .page .body > *,.leave > *{grid-column:1 / -1}
  .margin{position:absolute;left:0;right:0;bottom:16px;display:flex;flex-direction:row;justify-content:space-between;align-items:baseline}
  .folio .fn{font:400 15px/1.4 var(--text);color:var(--ink-3)}
  .folio{gap:5px}
  .nextl{flex-direction:row;gap:8px;align-items:baseline;padding-top:0}
  .status{position:absolute;left:0;right:0;bottom:44px;min-height:0;font-size:14px;padding:0}
  .eyebrow{margin-bottom:6px;font-size:14.5px}
  h1{white-space:normal;height:2.5em;line-height:1.25;overflow:hidden;text-wrap:balance}
  .body{padding-top:18px;row-gap:var(--s3)}
  .leave{inset:18px 0 auto 0}
  .leave,.probe{grid-template-columns:minmax(0,1fr)}
  .footin{grid-template-columns:minmax(0,1fr);height:52px}
  .footin > .ex{display:none}
  .keys{grid-column:1;justify-content:space-between;gap:0}
  .lead{font-size:16.5px}
  .big{font-size:96px}
  .ref span{font-size:22px}
  .fig{gap:24px}
  .act{font-size:19px}
  .acts{gap:24px}
  .chart{height:250px}
  .uf{flex-direction:column;align-items:flex-start;gap:6px}
  .uf .lnk{margin-left:0}
  .readout{white-space:normal;line-height:1.7}
  .readout span{display:inline-block}
  .readout span+span{margin-left:0;margin-right:14px}
  .readout span:first-child{margin-right:14px}
  .figs{grid-template-columns:1fr 1fr;row-gap:14px;column-gap:16px}
  .tbl > *,.tbl .tr > *{padding-right:10px}
  .tbl .r,.tbl .th.r{padding-right:0;padding-left:10px}
  .tbl.nodes{grid-template-columns:minmax(0,1.2fr) .8fr 1fr .8fr}
  .tbl.ov{grid-template-columns:minmax(0,1.5fr) .5fr .9fr .9fr}
  .tbl.ov .bd,.tbl.ov .so{display:none}
  .tbl.gw{grid-template-columns:minmax(0,1fr) .9fr .8fr}
  .tbl.gw .st{display:none}
  .tbl.lg{grid-template-columns:minmax(0,1fr) 64px}
  .aside .tbl.pn{display:none}
  .tbl.lg .nd{display:none}
  .tbl.lg .lv{display:none}
  .tbl.nodes > .td{height:auto;padding:9px 0 0;border-bottom:0}
  .tbl.nodes > .td.sub{padding:2px 0 9px;border-bottom:1px solid var(--rule);font-size:14px}
  .tbl.nodes > .td.sub.empty{border-bottom-color:transparent}
  .tbl.nodes .st{grid-column:1 / 4}
  .li{grid-template-columns:52px minmax(0,1fr) auto;gap:10px;height:38px}
  .props{grid-template-columns:116px minmax(0,1fr)}
  .props > *{height:36px}
  .props.two{grid-template-columns:116px minmax(0,1fr)}
  .det{gap:10px}
  .note{font-size:15px;line-height:1.4}
  .h2{font-size:26px}
  .code{font-size:12px;line-height:1.7}
  .audit{grid-template-columns:52px minmax(0,1fr) auto;grid-auto-flow:row dense}
  .audit > *{padding-right:0;height:auto;padding-block:9px}
  .audit .tm{grid-column:1;grid-row:span 2}
  .audit .a{grid-column:2;border-bottom:0;padding-bottom:0}
  .audit .w{grid-column:3;justify-content:flex-end;border-bottom:0;padding-bottom:0}
  .audit .tg{grid-column:2 / -1;padding-top:2px;color:var(--ink-2);font-size:14.5px}
  .res{grid-template-columns:minmax(0,1fr)}
  .hit .h{font-size:13px}
  .qin{font-size:24px}
}
</style>

<div class="app" id="app">
  <header class="top"><div class="wrap grid topin">
    <div class="brand"><b>DaServer</b></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <span class="env">mmo, production</span><span class="ex">Example data</span>
  </div></header>
  <main class="stage wrap grid" id="stage">
    <aside class="margin" id="margin" aria-label="Position"><div class="folio" id="folio"></div><div class="nextl" id="nextl"></div></aside>
    <section class="page" aria-live="polite">
