<title>DaServer Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* A book page per screen: a narrow margin column (folio, what comes next, the latest status) beside one text column.
   Ink on paper, one indigo for whatever is wrong and for the next step. Hairlines only, square everything. */
:root{--paper:#F7F8FA;--ink:#111318;--ink-2:#3B3F4B;--ink-3:#5B6070;--rule:rgba(17,19,24,.14);--rule-2:rgba(17,19,24,.34);--indigo:#22397E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1014;--ink:#ECEEF2;--ink-2:#BDC1CB;--ink-3:#989DA9;--rule:rgba(236,238,242,.16);--rule-2:rgba(236,238,242,.34);--indigo:#9CAEF0;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1014;--ink:#ECEEF2;--ink-2:#BDC1CB;--ink-3:#989DA9;--rule:rgba(236,238,242,.16);--rule-2:rgba(236,238,242,.34);--indigo:#9CAEF0;color-scheme:dark}
:root{
  --display:'Shippori Mincho','Noto Serif JP','Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho','Songti SC',Georgia,serif;
  --text:'Newsreader','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --mc:224px;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--text);-webkit-font-smoothing:antialiased;font-kerning:normal;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit;border-radius:0}
:focus-visible{outline:1px solid var(--indigo);outline-offset:4px}
button:focus:not(:focus-visible){outline:none}
.ind{color:var(--indigo)}
.num{font-variant-numeric:tabular-nums lining-nums}
.sc{font:400 14px/1.4 var(--text);color:var(--ink-3)}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:1200px;margin-inline:auto}

/* header: one quiet grey line */
.top{border-bottom:1px solid var(--rule)}
.topin{display:grid;grid-template-columns:var(--mc) minmax(0,1fr) auto;align-items:baseline;height:68px;padding-top:26px}
.brand{display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.brand b{font:500 18px/1 var(--display);letter-spacing:.01em}
.brand span{font-size:14px;color:var(--ink-3)}
.tabs{display:flex;gap:30px}
.tabs button{font-size:15px;color:var(--ink-3);padding:2px 0}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-current="page"]{color:var(--ink)}
.ex{font-size:13px;font-style:italic;color:var(--ink-3)}
.top .ex{display:none}

/* stage */
.stage{display:grid;grid-template-columns:var(--mc) minmax(0,1fr);position:relative;min-height:0;overflow:hidden;padding-block:clamp(28px,6.5vh,64px) clamp(20px,4vh,40px);touch-action:none}
.margin{position:relative;display:flex;flex-direction:column;gap:22px;padding-right:32px}
.folio{display:flex;align-items:baseline;gap:8px;color:var(--ink-3)}
.folio .fn{font:400 46px/1 var(--display);color:var(--ink-3)}
.folio .fo{font-size:14px}
.nextl{display:flex;flex-direction:column;gap:4px}
.nx{font-size:15px;color:var(--ink-2);align-self:flex-start}
.nx:hover{color:var(--ink)}
.nx .ar{margin-left:6px;color:var(--ink-3)}
.status{position:absolute;left:0;bottom:clamp(20px,4vh,40px);width:calc(var(--mc) - 40px);margin:0;font-style:italic;font-size:15px;line-height:1.45;color:var(--ink-2);min-height:4.4em;display:flex;align-items:flex-end}
.page{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.eyebrow{font-style:italic;font-size:16px;margin:0 0 10px;height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font:500 clamp(40px,4.3vw,62px)/1.2 var(--display);margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:1.25em}
.body{position:relative;margin-top:clamp(22px,4.6vh,46px);min-height:0;overflow:hidden}

/* footer: fixed key hints */
.foot{border-top:1px solid var(--rule)}
.footin{display:grid;grid-template-columns:var(--mc) minmax(0,1fr);align-items:center;height:58px;padding-bottom:env(safe-area-inset-bottom,0px)}
.keys{display:flex;gap:34px;align-items:baseline;white-space:nowrap}
.kh{display:inline-flex;align-items:baseline;gap:8px}
.k{font:600 15px/1 var(--text);color:var(--ink);padding:4px 2px}
.kd{font-size:14px;color:var(--ink-3)}
.kh button:hover + .kd,.kh .k:hover{color:var(--ink)}
.kh.off .k,.kh.off .kd{color:var(--ink-3);opacity:.5;cursor:default}

/* shared pieces */
.lead{font-size:clamp(17px,1.45vw,20px);line-height:1.6;color:var(--ink-2);max-width:56ch;margin:0;text-wrap:pretty}
.acts{display:flex;align-items:baseline;gap:36px;flex-wrap:wrap}
.act{font:500 clamp(19px,1.6vw,23px)/1.3 var(--display);padding:4px 0 5px;border-bottom:1px solid currentColor}
.act:hover{box-shadow:inset 0 -1px 0 currentColor}
.act.pri{color:var(--indigo)}
.act.sec{color:var(--ink-2);border-color:var(--rule-2)}
.act:disabled{color:var(--ink-3);border-color:var(--rule);cursor:default;box-shadow:none}
.code{font:400 13.5px/1.85 var(--mono);color:var(--ink-2);margin:0;white-space:pre-wrap;word-break:break-word}
.code .ind{font-weight:500}
.props{display:grid;grid-template-columns:150px minmax(0,1fr);margin:0}
.props > *{padding:9px 0;border-bottom:1px solid var(--rule);margin:0}
.props dt{color:var(--ink-3);font-size:15px}
.props dd{font-variant-numeric:tabular-nums}
.props.two{grid-template-columns:110px minmax(0,1fr) 110px minmax(0,1fr)}

/* incident */
.inc{display:flex;flex-direction:column;gap:clamp(18px,3.4vh,34px)}
.fig{display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap}
.big{font:400 clamp(92px,10.5vw,150px)/.86 var(--display);color:var(--indigo);font-variant-numeric:tabular-nums}
.bigu{font:400 clamp(26px,2.4vw,34px)/1 var(--display);color:var(--indigo);margin-left:10px}
.ref{display:flex;gap:36px;padding-bottom:6px}
.ref i{font-style:italic}
.ref span{display:flex;flex-direction:column;gap:4px;font:400 26px/1.1 var(--display)}
.chartw{position:relative}
.chart{position:relative;height:clamp(220px,40vh,360px)}
.chart .uplot{width:100%!important}
.readout{margin:16px 0 0;font-size:15px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.readout b{font-weight:500;color:var(--ink)}
.readout b.ind{color:var(--indigo)}
.readout span+span{margin-left:24px}
.rorow{display:flex;justify-content:space-between;align-items:baseline;gap:24px;margin-top:16px}
.rorow .readout{margin:0;min-width:0}
.rorow .lnk{flex:none}
.logs{display:flex;flex-direction:column}
.logs .code{padding:14px 0;border-bottom:1px solid var(--rule)}
.logs .code:first-child{border-top:1px solid var(--rule)}

/* server type */
.srv{display:flex;flex-direction:column;gap:clamp(14px,2.8vh,28px)}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule)}
.figs > div{display:flex;flex-direction:column;gap:4px;padding:14px 0 0}
.fv{font:400 clamp(28px,2.7vw,38px)/1.1 var(--display);font-variant-numeric:tabular-nums}
.fu{font-size:14.5px;color:var(--ink-3)}
.tbl.ov{grid-template-columns:1.6fr .6fr .9fr .9fr 1.3fr}
.tbl.ov .tr{display:contents;cursor:pointer}
.tbl.ov .tr:hover .td{color:var(--ink)}
.tbl.ov .tr:focus-visible .td{box-shadow:inset 0 -1px 0 var(--indigo)}

.tbl.ov .bd{padding-left:48px}
.tbl.gw{grid-template-columns:1.6fr 1fr 1fr;max-width:640px}
.tbl{display:grid;grid-template-columns:1fr 2.2fr .7fr .9fr .8fr .7fr;column-gap:0}
.tbl > .r{padding-left:16px}
.tbl > .th{padding:0 0 8px;border-bottom:1px solid var(--rule-2)}
.tbl > .td,.tbl .tr > .td{height:clamp(36px,4.8vh,44px);display:flex;align-items:center;border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.tbl > .td.empty{border-bottom-color:transparent}
.tbl .r{justify-content:flex-end;text-align:right}
.tbl .th.r{text-align:right}
.tbl .st{color:var(--ink-2)}
.tbl.dim .td{color:var(--ink-3)}
.tbl.dim .td.hl{color:var(--ink)}
.tbl.dim .td.hl.ind,.tbl .td.ind{color:var(--indigo)}
.lnk{font-size:15px;color:var(--ink-2);border-bottom:1px solid var(--rule-2);padding-bottom:1px}
.lnk:hover{color:var(--ink);border-color:var(--ink)}

/* list + detail (changes, actors) */
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(32px,5vw,72px);align-items:start}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--rule);color:var(--ink-3);font-variant-numeric:tabular-nums}
.li:hover{color:var(--ink-2)}
.li.on{color:var(--ink)}
.li.on .k1{font-weight:600}
.li .ind{color:var(--indigo)}
.li .k3{text-align:right}
.li.two{grid-template-columns:minmax(0,1fr) auto}
.det{display:flex;flex-direction:column;gap:20px;min-width:0}
.h2{font:500 clamp(28px,2.6vw,38px)/1.2 var(--display);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{margin:0;font-style:italic;color:var(--indigo);min-height:1.55em}
.blk{display:flex;flex-direction:column;gap:6px}

/* audit */
.audit{display:grid;grid-template-columns:92px 140px 210px minmax(0,1fr);column-gap:0;border-top:1px solid var(--rule)}
.audit > *{padding:11px 20px 11px 0;border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.audit .w{color:var(--ink-3)}

/* find and confirm */
.qin{width:100%;max-width:720px;background:none;border:0;border-bottom:1px solid var(--rule-2);font:400 clamp(24px,2.3vw,32px)/1.3 var(--display);padding:6px 0 10px;outline:none;color:var(--ink)}
.qin::placeholder{color:var(--ink-3)}
.qin:focus{border-bottom-color:var(--ink)}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin-top:clamp(20px,4vh,36px)}
.rg{display:flex;flex-direction:column}
.rg .sc{padding-bottom:8px;border-bottom:1px solid var(--rule)}
.hit{display:flex;justify-content:space-between;gap:12px;padding:7px 0;color:var(--ink-3);border-bottom:1px solid var(--rule)}
.hit .h{font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit:hover{color:var(--ink-2)}
.hit.on{color:var(--ink)}
.hit.on .t{font-weight:600}
.nores{color:var(--ink-3);font-style:italic}
.cf{display:flex;flex-direction:column;gap:clamp(16px,3vh,28px);max-width:720px}
.cf label{color:var(--ink-3);font-size:15px}
.cf label b{color:var(--ink);font-weight:600}

/* text morph: unchanged characters stay, changed ones blur out and in */
.mw{position:relative;display:inline-block;width:0;vertical-align:baseline;overflow:visible}
.mo{position:absolute;left:0;bottom:0;white-space:pre;pointer-events:none;animation:mOut .2s cubic-bezier(.4,0,1,1) forwards}
.mi{display:inline;animation:mIn .32s cubic-bezier(.25,.6,.25,1) .07s backwards}
@keyframes mOut{to{filter:blur(6px);opacity:0}}
@keyframes mIn{from{filter:blur(6px);opacity:0}}
/* entering a page: lines slide in from the direction of travel */
.enter .ln{animation:var(--slide) .36s cubic-bezier(.2,.75,.25,1) backwards;animation-delay:calc(var(--i,0) * 26ms)}
.up{--slide:sUp}.down{--slide:sDown}.left{--slide:sLeft}.right{--slide:sRight}
@keyframes sUp{from{transform:translateY(30px)}}
@keyframes sDown{from{transform:translateY(-30px)}}
@keyframes sLeft{from{transform:translateX(44px)}}
@keyframes sRight{from{transform:translateX(-44px)}}
@media (prefers-reduced-motion:reduce){.mo{display:none}.mi,.enter .ln{animation:none!important}}

/* uPlot (its stylesheet, trimmed to what this page uses) */
.uplot,.uplot *{box-sizing:border-box}
.uplot{width:min-content;font-family:var(--text)}
.u-wrap{position:relative;user-select:none}
.u-over,.u-under{position:absolute}
.u-under{overflow:hidden}
.uplot canvas{display:block;position:relative;width:100%;height:100%}
.u-axis{position:absolute}
.u-cursor-x,.u-cursor-y{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.u-hz .u-cursor-x{height:100%;border-right:1px solid var(--rule-2)}
.u-hz .u-cursor-y{display:none}
.u-cursor-pt{display:none}
.u-axis.u-off,.u-select.u-off,.u-cursor-x.u-off,.u-cursor-y.u-off{display:none}
.u-select{display:none}

/* phone: same order, more screens */
@media (max-width:719px){
  :root{--mc:0px}
  body{font-size:16px}
  .topin{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;height:auto;padding-top:16px;row-gap:12px}
  .tabs{grid-column:1 / -1;grid-row:2;gap:0;justify-content:space-between;padding-bottom:12px}
  .tabs button{font-size:14.5px}
  .top .ex{display:block;grid-column:2;grid-row:1}
  .stage{grid-template-columns:minmax(0,1fr);padding-block:22px 16px}
  .margin{position:absolute;left:0;right:0;bottom:16px;flex-direction:row;justify-content:space-between;align-items:baseline;padding:0}
  .folio .fn{font-size:15px;font-family:var(--text);color:var(--ink-3)}
  .folio{gap:5px}
  .nextl{flex-direction:row;gap:8px;align-items:baseline}
  .status{width:auto;right:0;bottom:44px;min-height:0;font-size:14px}
  .page{padding-bottom:84px}
  .eyebrow{margin-bottom:6px;font-size:14.5px}
  h1{font-size:30px;white-space:normal;height:2.5em;line-height:1.25;overflow:hidden;text-wrap:balance}
  .body{margin-top:18px}
  .footin{grid-template-columns:minmax(0,1fr);height:52px}
  .footin > .ex{display:none}
  .keys{justify-content:space-between;gap:0}
  .lead{font-size:16.5px}
  .big{font-size:96px}
  .ref span{font-size:22px}
  .fig{gap:24px}
  .act{font-size:19px}
  .acts{gap:24px}
  .chart{height:250px}
  .readout{white-space:normal;line-height:1.7}
  .rorow{flex-direction:column;gap:6px}
  .readout span{display:inline-block}
  .readout span+span{margin-left:0;margin-right:14px}
  .readout span:first-child{margin-right:14px}
  .figs{grid-template-columns:1fr 1fr;row-gap:14px}
  .tbl{grid-template-columns:minmax(0,1.2fr) .8fr 1fr .8fr;column-gap:10px}
  .tbl.ov,.tbl.gw{column-gap:0}
  .tbl.ov{grid-template-columns:minmax(0,1.5fr) .5fr .9fr .9fr}
  .tbl.ov .bd{display:none}
  .tbl.gw{grid-template-columns:minmax(0,1fr) 1fr 1fr}
  .tbl.ov > .td,.tbl.ov .td,.tbl.gw > .td{height:42px;padding:0;border-bottom:1px solid var(--rule)}
  .tbl > .td{height:auto;padding:9px 0 0;border-bottom:0}
  .tbl > .td.sub{padding:2px 0 9px;border-bottom:1px solid var(--rule);font-size:14px}
  .tbl > .td.sub.empty{border-bottom-color:transparent}
  .tbl .st{grid-column:1 / 4}
  .split{grid-template-columns:minmax(0,1fr);gap:22px}
  .li{padding:6px 0;grid-template-columns:52px minmax(0,1fr) auto;gap:10px}
  .props{grid-template-columns:116px minmax(0,1fr)}
  .props > *{padding:5px 0}
  .props.two{grid-template-columns:116px minmax(0,1fr)}
  .det{gap:10px}
  .note{font-size:15px;line-height:1.4}
  .h2{font-size:26px}
  .code{font-size:12px;line-height:1.7}
  .audit{grid-template-columns:52px minmax(0,1fr) auto;column-gap:0;grid-auto-flow:row dense}
  .audit > *{padding-right:0}
  .audit .tm{grid-column:1;grid-row:span 2}
  .audit .a{grid-column:2;border-bottom:0;padding-bottom:0}
  .audit .w{grid-column:3;text-align:right;border-bottom:0;padding-bottom:0}
  .audit .tg{grid-column:2 / -1;padding-top:2px;color:var(--ink-2);font-size:14.5px}
  .res{grid-template-columns:minmax(0,1fr);gap:0}
  .hit .h{font-size:13px}
  .qin{font-size:24px}
}
</style>

<div class="app" id="app">
  <header class="top"><div class="wrap topin">
    <div class="brand"><b>DaServer</b><span>mmo, production</span></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <span class="ex">Example data</span>
  </div></header>
  <main class="stage wrap" id="stage">
    <aside class="margin" id="margin" aria-label="Position"></aside>
    <section class="page" aria-live="polite">
      <div class="head"><p class="eyebrow sc" id="eb" data-m="eb"></p><h1 id="h1" data-m="h1"></h1></div>
      <div class="body" id="body"></div>
    </section>
    <p class="status" id="status" role="status"><span data-m="status"></span></p>
  </main>
  <footer class="foot"><div class="wrap footin"><span class="ex">Example data</span><div class="keys" id="keys"></div></div></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lethargy@1.0.9/lethargy.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.2.0/diff.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var qa = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function M(key, text, cls, tag) { tag = tag || 'span'; return '<' + tag + (cls ? ' class="' + cls + '"' : '') + ' data-m="' + key + '">' + esc(text) + '</' + tag + '>'; }
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)');
  function rnd(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function ms(v) { return v < 10 ? v.toFixed(1) : String(Math.round(v)); }

  // ---------- example data (from the previous console) ----------
  var N = 120, DEPLOY = 79, LIMIT = 25, T0 = Date.UTC(2026, 9, 20, 17, 2) / 1000;
  var XS = []; for (var xi = 0; xi < N; xi++) XS.push(T0 + xi * 60 * 60 / (N - 1));
  function clock(i) { var t = 17 * 60 + 2 + Math.round(i * 60 / (N - 1)), h = Math.floor(t / 60), m = t % 60; return h + ':' + (m < 10 ? '0' : '') + m; }
  function series(seed, base, amp, now, step) {
    var a = [];
    for (var i = 0; i < N; i++) { var v = base * (1 + amp * Math.sin(i / 9 + seed) + amp * .5 * Math.sin(i / 3.1 + seed * 2) + (rnd(seed * 100 + i) - .5) * amp * .6); if (step && i >= step[0]) v *= step[1] + (rnd(i + seed) - .5) * .08; a.push(v); }
    a[N - 1] = now; return a;
  }
  var TYPES = [
    { id: 'gw', name: 'GatewayServer', actors: 'Connection', count: '82,103', rps: '412k', err: '0.000%', now: 3.1, usual: 3.0, build: '2026.10.20-3', p: series(11, 3.1, .06, 3.1),
