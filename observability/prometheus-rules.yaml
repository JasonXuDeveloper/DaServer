# Alert rules for a DaServer cluster. Nodes push their metrics over OTLP every 15 s (the export interval DaServer pins)
# to one OpenTelemetry Collector, which sends them to Prometheus's OTLP endpoint (/api/v1/otlp, enabled with
# --web.enable-otlp-receiver). Prometheus scrapes no node. prometheus.yml sets
# `otlp: { promote_resource_attributes: [daserver.cluster] }`; a `service.namespace` would make `job` read "ns/name",
# so DaServer sets none.
# Load the rules with `rule_files:` in prometheus.yml, or wrap the group in a PrometheusRule for the Prometheus Operator.
# Thresholds are starting points: tune them to the application's load. A rule that compares a reading against a number
# carries it as `daserver_limit` (with `daserver_unit`), so a console can draw the limit without a threshold of its own.
#
# Labels. Each rule keeps `cluster`, and the rules about nodes also keep `type` (the node group, the OpenTelemetry
# resource's service.name) and `node` (service.instance.id), so Alertmanager groups an incident as one rule on one
# server type of one cluster, a silence can be scoped to a type, and one Prometheus can hold several clusters.
# DaServer's own metrics carry the three as
# labels; runtime metrics (dotnet_*) carry only the resource, which the OTLP endpoint maps to `job` (service.name),
# `instance` (service.instance.id) and `daserver_cluster`, and the GC rule renames them. A label a node does not send yet
# is simply empty, so the rules also work on a single cluster.
#
# Freshness. Pushed series get no staleness markers: a node that stops leaves its last sample visible for the 5-minute
# lookback. Rules over gauges therefore read only samples from the last 2 minutes (`last_over_time(...[2m])`, eight
# pushes), so a departed node's last value does not linger, and rates use windows of at least four pushes.
# A parked hot-restart instance exports no metrics, so two processes never write one node's series.
groups:
  - name: daserver
    rules:
      - alert: DaServerShardStalled
        expr: max by (cluster, type, node) (last_over_time(daserver_shard_stalled[2m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "A shard of {{ $labels.node }} is stuck in one pass"
          description: "A shard thread has run one pass longer than StallAfter (blocking IO or an endless loop in a handler or system). Liveness (/alive) fails too, so the platform restarts the node."

      - alert: DaServerMembersDisagree
        # Compares the membership table version each node has read, not member counts: during a long rollout nodes join
        # and leave all the time and read the table a few seconds apart, so counts differ for good while every node is
        # fine. A node is behind only when the cluster's newest version is ahead of it and its own has not moved for two
        # minutes: it cannot read the table (it is isolated, or its membership data source is starved).
        # Target (roadmap W7e): today's nodes export no daserver_cluster_view_version, so this never fires yet.
        expr: >-
          (
            max by (cluster) (last_over_time(daserver_cluster_view_version[2m]))
            - on (cluster) group_right
            max by (cluster, type, node) (last_over_time(daserver_cluster_view_version[2m]))
          ) > 0
          and on (cluster, type, node)
          max by (cluster, type, node) (changes(daserver_cluster_view_version[2m])) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} is stuck on an old membership view"
          description: "The cluster has moved on and this node's view has not changed for 4 minutes: it cannot read the membership table (isolated, a starved membership connection, or a network split). Compare /admin/membership of the nodes."

      - alert: DaServerMessagesDropped
        expr: sum by (cluster, type, node, reason) (rate(daserver_messages_dropped_total{reason!="deleting"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} drops messages ({{ $labels.reason }})"
          description: "queue_full: a shard's dispatch queue is full (the node is overloaded); mailbox_full: an actor's mailbox is full (mail piled up while it loads or leaves, a slow store or handoff, or a hot actor behind on its backlog); expired: requests waited past their caller's timeout. One-way mail to an actor being deleted (reason deleting) is expected and not alerted."

      - alert: DaServerHandlerFailures
        expr: sum by (cluster, type, node) (rate(daserver_handler_failed_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          daserver_limit: "1"
          daserver_unit: "1/s"
          summary: "Handlers on {{ $labels.node }} keep failing"
          description: "More than one handler or system pass a second throws: a poison message, a broken dependency or a broken system. The node's logs name the handler and message (MessageFailed, ActorFailed for lifecycle handlers) or the system (SystemFailed)."

      - alert: DaServerShardsSaturated
        expr: avg by (cluster, type, node) (last_over_time(daserver_shard_busy_ratio[2m])) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          daserver_limit: "0.85"
          daserver_unit: "ratio"
          summary: "{{ $labels.node }}'s shards are busy {{ $value | humanizePercentage }} of the time"
          description: "The node has little headroom: add nodes to its group (the default scaling metric), or shards if its cores are idle."

      - alert: DaServerTicksLate
        expr: sum by (cluster, type, node) (rate(daserver_shard_tick_overruns_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          daserver_limit: "1"
          daserver_unit: "1/s"
          summary: "{{ $labels.node }} cannot keep its tick rate"
          description: "Ticks start a whole interval late: systems take longer than the tick, or the node lacks CPU."

      - alert: DaServerGcPauses
        expr: >-
          label_replace(label_replace(label_replace(
            sum by (daserver_cluster, job, instance) (rate(dotnet_gc_pause_time_seconds_total[5m])),
            "cluster", "$1", "daserver_cluster", "(.*)"), "type", "$1", "job", "(.*)"), "node", "$1", "instance", "(.*)")
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          daserver_limit: "0.05"
          daserver_unit: "ratio"
          summary: "{{ $labels.node }} spends over 5% of its time in GC pauses"
          description: "Something allocates on a hot path, or the heap is near its limit. Compare dotnet_gc_heap_total_allocated_bytes_total over time."

      - alert: DaServerNodeSilent
        # A node that dies stops pushing: its series fade and its other alerts resolve, so it would read as healthy. This
        # fires for a node seen in the last 15 minutes that has pushed nothing for two minutes (eight pushes), unless its
        # last push was its graceful stop. A stopping node records each stop phase as it ends and flushes them in its
        # final push together with its membership gauge; only the last phase, `close`, means the stop finished, so a
        # node that crashes in the middle of a long drain is still reported. The stop's sample must be no more than 5 s
        # older than the last membership sample, since the two are pushed together but need not carry equal timestamps.
        # A node that stopped, came back under the same name and then died is reported, since its later membership
        # samples are newer than its stop. Fifteen minutes, not an hour: a crashed gateway or stateless pod comes back
        # under a new name, and its old name should not page for an hour after the platform healed it. This rule needs
        # the OTLP path: a scrape carries no final push, so where nodes are scraped (no Collector) every graceful stop
        # would fire it; leave it out there.
        expr: >-
          (
            max by (cluster, type, node) (present_over_time(daserver_cluster_members[15m]))
            unless on (cluster, type, node) present_over_time(daserver_cluster_members[2m])
          )
          unless on (cluster, type, node)
          (
            max by (cluster, type, node) (max_over_time(timestamp(daserver_stop_phase_duration_milliseconds_count{phase="close"})[15m:1m]))
            >= on (cluster, type, node)
            max by (cluster, type, node) (max_over_time(timestamp(daserver_cluster_members)[15m:1m])) - 5
          )
        for: 1m
        labels:
          severity: critical
        annotations:
          daserver_limit: "120"
          daserver_unit: "s"
          summary: "{{ $labels.node }} has pushed no metrics for over two minutes"
          description: "The node died, lost its route to the Collector, or the Collector dropped it, without a graceful stop. Its other alerts cannot fire while it is silent. Check /health on the node and the Collector's logs."

      - alert: DaServerNodeRequestsLow
        # After a crash takeover on Kubernetes the node runs in the container that was parked, with the idle-sized
        # requests (ADR-098): little CPU weight, first in line for the OOM killer. The node reports it until the
        # resize-only rollout run sets the requests by role again; the Dashboard dispatches that run itself when it sees
        # the gauge (once per incarnation plus one retry, outside the type's lock), so ten minutes covers a queued run
        # and this fires only when that keeps failing or no Dashboard runs. Target (roadmap W11): today's nodes export
        # no such gauge.
        expr: max by (cluster, type, node) (last_over_time(daserver_node_requests_low[2m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} runs on the parked container's idle-sized requests"
          description: "A crash takeover left the node in the container sized for a parked instance. Run the rollout with --type, --node, --incarnation and --resize-only for this node (the Dashboard's Resize action) to set the requests by role again."

      - alert: DaServerAskLatencyHigh
        # Target (roadmap W7e): today's nodes export no ask histogram, so this never fires yet. The histogram is recorded
        # by the node that handles the ask, so `type` is the callee's server type. The type's p99 is the recording rule
        # below, from buckets merged across its nodes, never a percentile of node percentiles. The Dashboard draws the
        # type's limit from daserver_limit.
        expr: cluster_type:daserver_ask_duration_seconds:p99 > 0.025
        for: 5m
        labels:
          severity: warning
        annotations:
          daserver_limit: "0.025"
          daserver_unit: "s"
          summary: "Asks to {{ $labels.type }} take {{ $value | humanizeDuration }} at p99"
          description: "Asks to this server type are slower than its limit: a hot actor, a slow store behind commits, or a node short of CPU. The Dashboard's incident shows the spread across nodes and the slowest actors."

      - alert: DaServerOnceTooOld
        # Target (roadmap W6): a [Once] attempt sent more than MaxAskTimeout + ClockSkew ago is dropped by its receiver.
        # A steady rate means a clock (a node's, or a gateway's for clients) has drifted past ClockSkew, and every
        # attempt from it is being dropped silently while AskUntilAnswered keeps asking.
        expr: sum by (cluster, type, node) (rate(daserver_once_too_old_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} drops [Once] attempts as too old"
          description: "Attempts arrive sent more than MaxAskTimeout + ClockSkew ago: check NTP on the senders' nodes and the gateways, and DaServer:ClockSkew."

      - alert: DaServerOnceStaleAsking
        # Target (roadmap W6): acknowledgements are sent from written state only, so an AskUntilAnswered can never be
        # answered Stale. One that is means a runtime defect: the ask stops and waits for reconciliation. The stopped
        # asks are counted by the sweeping node's ask census every minute (the ask index's keys and those roots' record
        # headers), so the alert holds
        # across idle unloads and restarts until reconciliation clears them. The gauge's points carry `hosting_type` (the
        # server type hosting the actor type, from membership's hosted types) and `actor_type`; its series' resource
        # `type` is the sweeper's own, so the rule maps `hosting_type` onto `type` and silences by type match. A node
        # exports it only while it sweeps and the census read succeeded (never a cached value, never while frozen), so a
        # sweeper change leaves at most one stale series for the 3-minute window. The counter is exported at 0 from node
        # start, so the first Stale shows as an increase.
        expr: |
          label_replace(
            max by (cluster, hosting_type, actor_type) (last_over_time(daserver_once_stopped[3m])),
            "type", "$1", "hosting_type", "(.*)"
          ) > 0
          or on (cluster, type)
          sum by (cluster, type) (increase(daserver_once_stale_asking_total[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.type }} has an ask stopped by a Stale answer"
          description: "An AskUntilAnswered was answered Stale and stopped asking{{ if $labels.actor_type }} on {{ $labels.actor_type }} actors{{ end }}. Its operation needs reconciliation; report the runtime defect with the node's logs."

      - alert: DaServerOnceCounterLow
        # Target (roadmap W6): a saved actor's [Once] counter has fewer than 2^24 numbers left; it stops sending [Once]
        # when it runs out. The gauge is the number of such roots on the node.
        expr: max by (cluster, type, node) (last_over_time(daserver_once_counter_low[2m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} has actors running out of [Once] numbers"
          description: "An actor has sent about four billion [Once] requests in one record's life. Delete and recreate it (a new record starts a new seed) before the counter runs out."

      - alert: DaServerOnceAskOld
        # Target (roadmap W6): every AskUntilAnswered ask is a row of its own in the store, never in a record, so nothing
        # refuses an ask for their number; back-pressure refuses only new work at a root's admission (OnceQueued). A
        # stuck or unhosted downstream shows as old rows, whether the backlog keeps growing or goes flat once admission
        # refuses; a healthy ramp only adds young rows. The sweeping node reads the age of the oldest ask row not stopped
        # per actor type every minute (its ask census: the ask index's keys and those roots' record headers) and exports
        # daserver.once.ask_age in seconds like daserver.once.stopped (points labelled hosting_type, one per server type
        # hosting the actor type or "none", and actor_type; only while it sweeps and the read succeeded), so the rule maps
        # hosting_type onto type. The limit is three MaxAskTimeouts (1 minute by default). With no live host, type reads
        # "none" (an incident of the cluster).
        expr: |
          label_replace(
            max by (cluster, hosting_type, actor_type) (last_over_time(daserver_once_ask_age_seconds[3m])),
            "type", "$1", "hosting_type", "(.*)"
          ) > 180
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Asks from {{ $labels.actor_type }} actors are waiting long (hosted by {{ $labels.type }})"
          description: "The oldest AskUntilAnswered row of this actor type has waited {{ $value | humanizeDuration }}. Restore the receiving type, or fix a handler that asks more than once per answer."
          daserver_limit: "180"
          daserver_unit: "s"

      - alert: DaServerOnceQueuedFull
        # Target (roadmap W6): a node holds roots whose queued asks passed OnceQueued or Once:QueuedBytes, so new ordinary
        # requests and client [Once] requests to them get Busy. The count includes queued rows not yet written (a store
        # outage grows them in memory). Briefly at a peak is back-pressure working; for ten minutes it is a receiver
        # that does not keep up, or a store that does not take the writes.
        expr: max by (cluster, type, node) (last_over_time(daserver_once_queued_full[2m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} refuses new work to roots whose asks are queued"
          description: "Roots on this node have kept more queued AskUntilAnswered rows than OnceQueued allows for ten minutes; their new requests get Busy. Look at the receivers they ask (DaServerOnceAskOld)."

      - alert: DaServerOnceUnknownState
        # Target (roadmap W6): an answer arrived for an AskUntilAnswered whose state type this build does not know. The
        # row stays sent and unanswered so a node of a build that knows the type delivers it after the next move or
        # restart; during a rollback or a mixed-version run that is expected for minutes, never for long. A state type is
        # removed in two releases (stop creating it, then remove it once the upgrade check sees no rows); a rollback past
        # the build that added a type, or a removal that skipped the first step, leaves rows no running build knows.
        expr: sum by (cluster, type, node) (increase(daserver_once_unknown_state_total[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} holds asks whose state type its build does not know"
          description: "Answers to AskUntilAnswered calls carry a state type this build lacks (a rollback past the build that added it, a mixed rollout, or a removal that skipped its first release). They are kept, not lost: finish the rollout, or re-release a build that knows the type until those asks are answered."

      - alert: DaServerOnceSendersNearCap
        # Target (roadmap W6): a [Once] receiver on this node holds more than 90% of SendersPerReceiver sender rows.
        # Past the cap new senders get WindowFull; rows free only as senders are destroyed.
        expr: max by (cluster, type, node) (last_over_time(daserver_once_senders[2m]))
          / max by (cluster, type, node) (last_over_time(daserver_once_senders_cap[2m])) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A [Once] receiver on {{ $labels.node }} nears its sender-row cap"
          description: "One receiver keeps sender rows at {{ $value | humanizePercentage }} of SendersPerReceiver. Destroy finished senders (orders after a sale) or raise the cap; past it new senders are refused."
          daserver_limit: "0.9"
          daserver_unit: "ratio"

      - alert: DaServerStoreWritesBehind
        # Target (roadmap W6): a node's oldest change not yet written is older than four CheckpointIntervals (30 s by
        # default) for 5 minutes. A full store outage freezes the worlds after IsolationTimeout; an outage of data writes
        # only (a locked table, a full disk) or of the synchronous standbys (membership writes then wait too:
        # DaServerMembershipWritePending), with membership reads still answering, freezes nothing, so unwritten changes and asks grow
        # in memory until this is acted on. The gauge leaves out roots ruled unwritable (DaServerRecordUnwritable), so
        # one oversized record never reads as a store that stopped; a root is ruled unwritable only for a RowDeterministic
        # outcome (PostgreSQL: SQLSTATE 22xxx, 23xxx, 54xxx) while the rest of its batch landed, so a read-only primary, a revoked
        # grant, a schema mismatch or a locked table keeps every root in the gauge and fires this. The limit is four of the default
        # DaServer:CheckpointInterval: a server type (node group) configured with a longer interval needs its own copy.
        expr: max by (cluster, type, node) (last_over_time(daserver_store_oldest_unsaved_age_seconds[2m])) > 120
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }} has changes unwritten for {{ $value | humanizeDuration }}"
          description: "The store does not take this node's writes. If membership still answers, nothing freezes and unwritten changes grow in memory; if it does not, the node is frozen too (daserver.membership.frozen). Check what the store's writes wait for first (PostgreSQL: its synchronous standbys, pg_stat_replication.sync_state: with no standby in 'quorum' or 'sync' every COMMIT waits; Redis or Valkey: its replicas, WAITAOF), then its locks, disk and errors (daserver.store.writes_waiting)."
          daserver_limit: "120"
          daserver_unit: "s"

      - alert: DaServerRecordUnwritable
        # Target (roadmap W6): a node holds a root whose record never lands (its state does not serialize, the record
        # is over MaxRecordBytes, or the store refuses its row with a row-deterministic error while the rest of the write
        # lands). The root keeps its last record and its held output, and is retried alone, until it is fixed.
        expr: max by (cluster, type, node) (last_over_time(daserver_store_unwritable_roots[2m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} holds {{ $value }} root(s) whose record cannot be written"
          description: "A root's record keeps failing to serialize or is refused by the store (logged RecordUnwritable). Its changes since the last record are lost on a crash. Fix the state (size, cycle, unregistered type) and redeploy. If many roots are listed, check the store's errors first (a schema change or a store limit)."
          daserver_limit: "0"
          daserver_unit: "roots"

      - alert: DaServerStoreDurabilityDropped
        # Target (roadmap W6, ADR-104): the store's effective durability class (2 Strict, 1 Replicated, 0 Local, -1 Unsafe;
        # the lower of the provider's declaration and its periodic self-check) fell below the class the node started
        # serving with, while still a class (Unsafe has its own rule below): a replication setting changed under a
        # running cluster (no synchronous standby configured, eviction turned on). Below Strict a failover or crash may
        # lose recent writes; nothing alerts on that, the class accepted it. Labelled by store (actors, membership,
        # dashboard). The started class is the node's first serving start, carried over a hot restart. Development
        # and TestCluster nodes export daserver_store_unsafe_exempt 1 and never fire.
        expr: |
          (
            (min by (cluster, type, node, store) (last_over_time(daserver_store_durability_class[2m])) >= 0)
              < min by (cluster, type, node, store) (last_over_time(daserver_store_durability_class_started[2m]))
          )
            unless on (cluster, type, node) (max by (cluster, type, node) (last_over_time(daserver_store_unsafe_exempt[2m])) == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }}'s {{ $labels.store }} store is below the durability it started with"
          description: "The store's self-check now finds a weaker class than at start: acknowledged writes may be lost in a failover. Restore the settings the self-check logs (DaServer:Store:SelfCheckInterval)."

      - alert: DaServerStoreUnsafe
        # Target (roadmap W6, ADR-104): the store's self-check finds a setting that can corrupt the database rather than
        # lose recent writes (PostgreSQL fsync or full_page_writes off), read on every new connection and every 10 s,
        # so this fires about 30 s after a node reports it. Nothing is refused: a serving node (or a hot restart's
        # standby) goes on under the Local rules, and a fresh start waits not ready before it joins. Development and
        # TestCluster nodes are exempt: they export daserver_store_unsafe_exempt 1 and never fire.
        expr: |
          min by (cluster, type, node, store) (last_over_time(daserver_store_durability_class[2m])) == -1
            unless on (cluster, type, node)
              (max by (cluster, type, node) (last_over_time(daserver_store_unsafe_exempt[2m])) == 1)
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }}'s {{ $labels.store }} store runs with fsync or full_page_writes off"
          description: "A crash of the database can now corrupt it rather than lose recent writes. Writes go on under the Local rules, but no durability guarantee holds across a database host crash meanwhile; a node starting meanwhile stays not ready. Turn the setting the self-check logs back on; the class returns within 10 s."

      - alert: DaServerMembershipDocumentLarge
        # Target (roadmap W6, ADR-103): the membership document is written whole on every change, and a change that would
        # pass the store's largest value (MaxValueBytes) is refused, so no death or re-placement could be written. Dead
        # entries leave it at re-placement, so its size follows the live members; past half the limit the cluster has
        # outgrown the store's value size (move membership to a store with larger values, or check that re-placement
        # runs). Every node exports both gauges from its last read.
        expr: |
          max by (cluster) (last_over_time(daserver_membership_document_bytes[3m]))
            > 0.5 * max by (cluster) (last_over_time(daserver_membership_document_limit_bytes[3m]))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The membership document is past half the store's largest value"
          description: "Membership changes rewrite the whole document; at the store's MaxValueBytes they are refused and no death or re-placement can be written. Check that re-placement moves dead entries out, or put membership on a store with a larger value limit (WithMembershipStore)."
          daserver_limit: "0.5"
          daserver_unit: "of MaxValueBytes"

      - alert: DaServerMembershipWritePending
        # Target (roadmap W6, ADR-103): a node has at most one membership write in flight, so one whose outcome stays
        # unknown (no synchronous standby up, the store slow, or failing writes while reads answer, e.g. a membership
        # store of its own; an unknown write stays pending until its backend is gone) holds back every later one from
        # that node: its heartbeats and its own restart permit wait, and on the coordinator deaths, dead_seen_at stamps
        # and re-placements wait; nothing steps down, since in a standby outage every node's writes wait alike, so this
        # fires on every node then. The lease rests on reads, so the node keeps running; this names the
        # stall that DaServerStoreWritesBehind (actor writes only) does not. The gauge is 0 while nothing is pending.
        expr: max by (cluster, type, node) (last_over_time(daserver_membership_write_pending_age_seconds[2m])) > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} has had a membership write pending for over a minute"
          description: "Until it settles, the node's later membership writes wait: heartbeats and its own restart permit, and on the coordinator deaths and re-placements. Check the membership store's write path (locks, disk, its synchronous standbys) and its logs."
          daserver_limit: "60"
          daserver_unit: "s"

      - alert: DaServerMembershipConnectionsLow
        # Target (roadmap W6, ADR-101): the membership role's connections against its CONNECTION LIMIT. A membership
        # write waiting for a standby is never terminated, a process holds one pending membership item at a time, and
        # one waits before its first membership write while the role's waits in COMMIT past StatementTimeout make no
        # progress, so in a standby outage the stuck backends are at most one per live process plus those of processes
        # that died while stuck (a crash-restart of the primary, a termination or a standby answering briefly starts
        # that window again, so nobody terminates them: the standby is restored); this
        # catches a limit sized too small for them, or another client on the role, before a node that must reconnect
        # is refused and its lease runs out. Every node reads, on its self-check cadence, the role's count across every
        # database (pg_stat_activity filtered on its own user, which a role sees without pg_read_all_stats) and its
        # limit (pg_roles.rolconnlimit, not exported when -1, unlimited; the > 0 guard keeps a stray -1 silent).
        expr: >
          max by (cluster) (last_over_time(daserver_membership_connections[3m]))
            > 0.8 * (max by (cluster) (last_over_time(daserver_membership_connection_limit[3m])) > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The membership role uses over 80% of its connection limit"
          description: "A node whose membership connection drops may not reconnect, then its lease runs out. Check for backends stuck in COMMIT (a standby outage: restore the standby, never terminate those backends) and other clients on the role, and size the role's CONNECTION LIMIT for every node process the cluster may run."
          daserver_limit: "0.8"
          daserver_unit: "of the role's CONNECTION LIMIT"

      - alert: DaServerMembershipRegressed
        # Target (roadmap W6, ADR-103): a node read a membership version below one it held, or a stored placement version
        # still above a fresh document. Membership needs a Strict store, whose provider never lets a waiting commit become
        # visible early, so this is a store fault (on PostgreSQL a crash-restart in place or a fast shutdown ending the
        # wait, then a failover before the standby received the commit; strict-mode quorum failover makes it rarer). The
        # framework does not repair it: the node freezes and fences without writing, exits with code 75, and the
        # platform restarts it with a new generation; unsaved state on it is lost, and every node that held the higher
        # version does the same. The counter is 0 or 1 per process, exported at 0 from node start and pushed before the
        # exit; max_over_time, not increase, so a regression found before the series' first push still fires.
        expr: max by (cluster, type, node) (max_over_time(daserver_membership_regressions_total[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }} read a membership version older than one it held and stopped"
          description: "The membership store lost a write it had shown, which a Strict store does only rarely (a crash-restart or fast shutdown, then a failover before a standby had it). Check the membership database's failover (quorum-aware, strict mode) and its synchronous standbys; the node restarts with a new generation."
          daserver_limit: "0"
          daserver_unit: "regressions"

      - alert: DaServerDeleteSendAfter
        # Target (roadmap W6): an item sent or asked after root.Delete() returned Ok, which reloads it. In an answer's
        # item the answer is delivered again and the error repeats: a user bug the DAS033 hint points at.
        expr: sum by (cluster, type, node) (increase(daserver_delete_send_after_total[10m])) > 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} keeps reloading {{ $labels.type }} items that send after Delete()"
          daserver_limit: "3"
          daserver_unit: "items/10m"
          description: "A handler sends or asks after root.Delete() returned Ok. Move Delete() last (analyzer hint DAS033)."

  - name: daserver-recording
    # Target (roadmap W7e): the ask histogram does not exist yet. A two-minute window holds eight 15 s pushes, and at
    # least four however the export drifts. `type` is the callee's server type (the handling node records the ask).
    rules:
      - record: cluster_type:daserver_ask_duration_seconds_bucket:rate2m
        expr: sum by (cluster, type, le) (rate(daserver_ask_duration_seconds_bucket[2m]))
      - record: cluster_type:daserver_ask_duration_seconds:p99
        expr: histogram_quantile(0.99, cluster_type:daserver_ask_duration_seconds_bucket:rate2m)
      - record: cluster_type_node:daserver_ask_duration_seconds:p99
        expr: histogram_quantile(0.99, sum by (cluster, type, node, le) (rate(daserver_ask_duration_seconds_bucket[2m])))
