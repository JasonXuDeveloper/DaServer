# Alert rules for a DaServer cluster. Nodes push their metrics over OTLP every 15 s (the export interval DaServer pins)
# to one OpenTelemetry Collector, which sends them to Prometheus's OTLP endpoint (/api/v1/otlp, enabled with
# --web.enable-otlp-receiver). Prometheus scrapes no node. prometheus.yml sets
# `otlp: { promote_resource_attributes: [daserver.cluster] }`; a `service.namespace` would make `job` read "ns/name",
# so DaServer sets none.
# Load the rules with `rule_files:` in prometheus.yml, or wrap the group in a PrometheusRule for the Prometheus Operator.
# Thresholds are starting points: tune them to the application's load. A rule that compares a reading against a number
# carries it as `daserver_limit` (with `daserver_unit`), so a console can draw the limit without a threshold of its own.
#
# Labels. Each rule keeps `cluster`, and the rules about nodes also keep `type` (the node group, the OpenTelemetry
# resource's service.name) and `node` (service.instance.id), so Alertmanager groups an incident as one rule on one
# server type of one cluster, a silence can be scoped to a type, and one Prometheus can hold several clusters.
# DaServer's own metrics carry the three as
# labels; runtime metrics (dotnet_*) carry only the resource, which the OTLP endpoint maps to `job` (service.name),
# `instance` (service.instance.id) and `daserver_cluster`, and the GC rule renames them. A label a node does not send yet
# is simply empty, so the rules also work on a single cluster.
#
# Freshness. Pushed series get no staleness markers: a node that stops leaves its last sample visible for the 5-minute
# lookback. Rules over gauges therefore read only samples from the last 2 minutes (`last_over_time(...[2m])`, eight
# pushes), so a departed node's last value does not linger, and rates use windows of at least four pushes.
# A parked hot-restart instance exports no metrics, so two processes never write one node's series.
groups:
  - name: daserver
    rules:
      - alert: DaServerShardStalled
        expr: max by (cluster, type, node) (last_over_time(daserver_shard_stalled[2m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "A shard of {{ $labels.node }} is stuck in one pass"
          description: "A shard thread has run one pass longer than StallAfter (blocking IO or an endless loop in a handler or system). Liveness (/alive) fails too, so the platform restarts the node."

      - alert: DaServerMembersDisagree
        # Compares the membership table version each node has read, not member counts: during a long rollout nodes join
        # and leave all the time and read the table a few seconds apart, so counts differ for good while every node is
        # fine. A node is behind only when the cluster's newest version is ahead of it and its own has not moved for two
        # minutes: it cannot read the table (it is isolated, or its membership data source is starved).
        # Target (roadmap W7e): today's nodes export no daserver_cluster_view_version, so this never fires yet.
        expr: >-
          (
            max by (cluster) (last_over_time(daserver_cluster_view_version[2m]))
            - on (cluster) group_right
            max by (cluster, type, node) (last_over_time(daserver_cluster_view_version[2m]))
          ) > 0
          and on (cluster, type, node)
          max by (cluster, type, node) (changes(daserver_cluster_view_version[2m])) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} is stuck on an old membership view"
          description: "The cluster has moved on and this node's view has not changed for 4 minutes: it cannot read the membership table (isolated, a starved membership connection, or a network split). Compare /admin/membership of the nodes."

      - alert: DaServerMessagesDropped
        expr: sum by (cluster, type, node, reason) (rate(daserver_messages_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} drops messages ({{ $labels.reason }})"
          description: "queue_full: a shard's dispatch queue is full (the node is overloaded); mailbox_full: an actor's mailbox is full (mail piled up while it loads or leaves, a slow store or handoff, or a hot actor behind on its backlog); expired: requests waited past their caller's timeout."

      - alert: DaServerHandlerFailures
        expr: sum by (cluster, type, node) (rate(daserver_handler_failed_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          daserver_limit: "1"
          daserver_unit: "1/s"
          summary: "Handlers on {{ $labels.node }} keep failing"
          description: "More than one handler or system pass a second throws: a poison message, a broken dependency or a broken system. The node's logs name the handler and message (MessageFailed, ActorFailed for lifecycle handlers) or the system (SystemFailed)."

      - alert: DaServerShardsSaturated
        expr: avg by (cluster, type, node) (last_over_time(daserver_shard_busy_ratio[2m])) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          daserver_limit: "0.85"
          daserver_unit: "ratio"
          summary: "{{ $labels.node }}'s shards are busy {{ $value | humanizePercentage }} of the time"
          description: "The node has little headroom: add nodes to its group (the default scaling metric), or shards if its cores are idle."

      - alert: DaServerTicksLate
        expr: sum by (cluster, type, node) (rate(daserver_shard_tick_overruns_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          daserver_limit: "1"
          daserver_unit: "1/s"
          summary: "{{ $labels.node }} cannot keep its tick rate"
          description: "Ticks start a whole interval late: systems take longer than the tick, or the node lacks CPU."

      - alert: DaServerGcPauses
        expr: >-
          label_replace(label_replace(label_replace(
            sum by (daserver_cluster, job, instance) (rate(dotnet_gc_pause_time_seconds_total[5m])),
            "cluster", "$1", "daserver_cluster", "(.*)"), "type", "$1", "job", "(.*)"), "node", "$1", "instance", "(.*)")
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          daserver_limit: "0.05"
          daserver_unit: "ratio"
          summary: "{{ $labels.node }} spends over 5% of its time in GC pauses"
          description: "Something allocates on a hot path, or the heap is near its limit. Compare dotnet_gc_heap_total_allocated_bytes_total over time."

      - alert: DaServerNodeSilent
        # A node that dies stops pushing: its series fade and its other alerts resolve, so it would read as healthy. This
        # fires for a node seen in the last 15 minutes that has pushed nothing for two minutes (eight pushes), unless its
        # last push was its graceful stop. A stopping node records each stop phase as it ends and flushes them in its
        # final push together with its membership gauge; only the last phase, `close`, means the stop finished, so a
        # node that crashes in the middle of a long drain is still reported. The stop's sample must be no more than 5 s
        # older than the last membership sample, since the two are pushed together but need not carry equal timestamps.
        # A node that stopped, came back under the same name and then died is reported, since its later membership
        # samples are newer than its stop. Fifteen minutes, not an hour: a crashed gateway or stateless pod comes back
        # under a new name, and its old name should not page for an hour after the platform healed it. This rule needs
        # the OTLP path: a scrape carries no final push, so where nodes are scraped (no Collector) every graceful stop
        # would fire it; leave it out there.
        expr: >-
          (
            max by (cluster, type, node) (present_over_time(daserver_cluster_members[15m]))
            unless on (cluster, type, node) present_over_time(daserver_cluster_members[2m])
          )
          unless on (cluster, type, node)
          (
            max by (cluster, type, node) (max_over_time(timestamp(daserver_stop_phase_duration_milliseconds_count{phase="close"})[15m:1m]))
            >= on (cluster, type, node)
            max by (cluster, type, node) (max_over_time(timestamp(daserver_cluster_members)[15m:1m])) - 5
          )
        for: 1m
        labels:
          severity: critical
        annotations:
          daserver_limit: "120"
          daserver_unit: "s"
          summary: "{{ $labels.node }} has pushed no metrics for over two minutes"
          description: "The node died, lost its route to the Collector, or the Collector dropped it, without a graceful stop. Its other alerts cannot fire while it is silent. Check /health on the node and the Collector's logs."

      - alert: DaServerNodeRequestsLow
        # After a crash takeover on Kubernetes the node runs in the container that was parked, with the idle-sized
        # requests (ADR-098): little CPU weight, first in line for the OOM killer. The node reports it until the
        # resize-only rollout run sets the requests by role again; the Dashboard dispatches that run itself when it sees
        # the gauge (once per incarnation plus one retry, outside the type's lock), so ten minutes covers a queued run
        # and this fires only when that keeps failing or no Dashboard runs. Target (roadmap W11): today's nodes export
        # no such gauge.
        expr: max by (cluster, type, node) (last_over_time(daserver_node_requests_low[2m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} runs on the parked container's idle-sized requests"
          description: "A crash takeover left the node in the container sized for a parked instance. Run the rollout with --type, --node, --incarnation and --resize-only for this node (the Dashboard's Resize action) to set the requests by role again."

      - alert: DaServerAskLatencyHigh
        # Target (roadmap W7e): today's nodes export no ask histogram, so this never fires yet. The histogram is recorded
        # by the node that handles the ask, so `type` is the callee's server type. The type's p99 is the recording rule
        # below, from buckets merged across its nodes, never a percentile of node percentiles. The Dashboard draws the
        # type's limit from daserver_limit.
        expr: cluster_type:daserver_ask_duration_seconds:p99 > 0.025
        for: 5m
        labels:
          severity: warning
        annotations:
          daserver_limit: "0.025"
          daserver_unit: "s"
          summary: "Asks to {{ $labels.type }} take {{ $value | humanizeDuration }} at p99"
          description: "Asks to this server type are slower than its limit: a hot actor, a slow store behind commits, or a node short of CPU. The Dashboard's incident shows the spread across nodes and the slowest actors."

      - alert: DaServerOnceTooOld
        # Target (roadmap W6): a [Once] attempt sent more than MaxAskTimeout + ClockSkew ago is dropped by its receiver.
        # A steady rate means a clock (a node's, or a gateway's for clients) has drifted past ClockSkew, and every
        # attempt from it is being dropped silently while AskUntilAnswered keeps asking.
        expr: sum by (cluster, type, node) (rate(daserver_once_too_old_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} drops [Once] attempts as too old"
          description: "Attempts arrive sent more than MaxAskTimeout + ClockSkew ago: check NTP on the senders' nodes and the gateways, and DaServer:ClockSkew."

      - alert: DaServerOnceStaleAsking
        # Target (roadmap W6): acknowledgements are sent from written state only, so an AskUntilAnswered can never be
        # answered Stale. One that is means a runtime defect: the ask stops and waits for reconciliation. The stopped
        # asks are counted from the records' stopped_asks column by the sweeping node every minute, so the alert holds
        # across idle unloads and restarts until reconciliation clears them. The gauge's points carry `hosting_type` (the
        # server type hosting the actor type, from membership's hosted types) and `actor_type`; its series' resource
        # `type` is the sweeper's own, so the rule maps `hosting_type` onto `type` and silences by type match. A node
        # exports it only while it sweeps and the count query succeeded (never a cached value, never while frozen), so a
        # sweeper change leaves at most one stale series for the 3-minute window. The counter is exported at 0 from node
        # start, so the first Stale shows as an increase.
        expr: |
          label_replace(
            max by (cluster, hosting_type, actor_type) (last_over_time(daserver_once_stopped[3m])),
            "type", "$1", "hosting_type", "(.*)"
          ) > 0
          or
          sum by (cluster, type) (increase(daserver_once_stale_asking_total[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.type }} has an ask stopped by a Stale answer"
          description: "An AskUntilAnswered was answered Stale and stopped asking ({{ $labels.actor_type }} when shown). Its operation needs reconciliation; report the runtime defect with the node's logs."

      - alert: DaServerOnceCounterLow
        # Target (roadmap W6): a saved actor's [Once] counter has fewer than 2^24 numbers left; it stops sending [Once]
        # when it runs out. The gauge is the number of such roots on the node.
        expr: max by (cluster, type, node) (last_over_time(daserver_once_counter_low[2m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} has actors running out of [Once] numbers"
          description: "An actor has sent about four billion [Once] requests in one record's life. Delete and recreate it (a new record starts a new seed) before the counter runs out."

      - alert: DaServerOnceUnsentFull
        # Target (roadmap W6): a root's asks written unsent reached the soft cap (Once:Unsent or Once:UnsentBytes), so its
        # ordinary mail, its type's systems and its timed items that ask stopped; [Once] requests and answers still run.
        # Brief episodes are back-pressure; a root that stays there has a stuck downstream. The gauge is the number of
        # such roots. A root holding unsent asks never counts as idle, so the gauge does not drop by an unload.
        expr: max by (cluster, type, node) (last_over_time(daserver_once_unsent_full[2m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} has {{ $labels.type }} actors stopped on unsent asks"
          description: "Asks to a downstream are piling up unsent. Check whether the receiving type is up and answering."

      - alert: DaServerOnceUnsentCeiling
        # Target (roadmap W6): a root's unsent asks reached the hard ceiling (Once:UnsentCeiling, three quarters of
        # MaxRecordBytes), so it now refuses [Once] requests whose handler asks with WindowFull. Past the soft cap only
        # [Once] and answers add unsent asks, at most OnceOutstanding times the largest fan-out the generator counted,
        # so reaching the ceiling means a downstream has been stuck for long.
        expr: max by (cluster, type, node) (last_over_time(daserver_once_unsent_ceiling[2m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }} has {{ $labels.type }} actors refusing [Once] requests at the unsent ceiling"
          description: "A root's unsent asks reached Once:UnsentCeiling. Restore the receiving type; its senders queue meanwhile."

      - alert: DaServerDeleteSendAfter
        # Target (roadmap W6): an item sent or asked after root.Delete() returned Ok, which reloads it. In an answer's
        # item the answer is delivered again and the error repeats: a user bug the DAS033 hint points at.
        expr: sum by (cluster, type, node) (increase(daserver_delete_send_after_total[10m])) > 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} keeps reloading {{ $labels.type }} items that send after Delete()"
          description: "A handler sends or asks after root.Delete() returned Ok. Move Delete() last (analyzer hint DAS033)."

  - name: daserver-recording
    # Target (roadmap W7e): the ask histogram does not exist yet. A two-minute window holds eight 15 s pushes, and at
    # least four however the export drifts. `type` is the callee's server type (the handling node records the ask).
    rules:
      - record: cluster_type:daserver_ask_duration_seconds_bucket:rate2m
        expr: sum by (cluster, type, le) (rate(daserver_ask_duration_seconds_bucket[2m]))
      - record: cluster_type:daserver_ask_duration_seconds:p99
        expr: histogram_quantile(0.99, cluster_type:daserver_ask_duration_seconds_bucket:rate2m)
      - record: cluster_type_node:daserver_ask_duration_seconds:p99
        expr: histogram_quantile(0.99, sum by (cluster, type, node, le) (rate(daserver_ask_duration_seconds_bucket[2m])))
